spring.application.name=currency-converter
spring.datasource.url=jdbc:h2:mem:currencydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# URL untuk ExchangeRate-API (Kita gunakan API percuma tanpa key untuk latihan awal)
exchangerate.api.url=https://er-api.com
